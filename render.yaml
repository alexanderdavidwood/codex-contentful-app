previews:
  generation: off

services:
  - type: web
    name: codex-contentful-app-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codex-contentful-app-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: CODEX_MODEL
        value: gpt-5.3-codex
      - key: CODEX_BIN
        value: /usr/local/bin/codex
      - key: MANAGED_PROJECT_ROOT
        value: /app/.runtime/projects

  - type: web
    name: codex-contentful-app-ui
    runtime: static
    buildCommand: npm ci && npm run build --workspace @codex-builder/contentful-app
    staticPublishPath: ./apps/contentful-app/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: codex-contentful-app-db
    plan: free
    postgresMajorVersion: "18"
    databaseName: codex_contentful_app
    user: codex_builder
    ipAllowList: []
